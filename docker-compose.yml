services:
  mongodb:
    image: mongo:7
    container_name: megashop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./carga_megashop.js:/scripts/carga_megashop.js
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: megashop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./carga_redis.redis:/scripts/carga_redis.redis
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data: